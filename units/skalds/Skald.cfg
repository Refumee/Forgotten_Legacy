#textdomain wesnoth-Forgotten_Legacy
[unit_type]
    id=Skald
    name= _ "Skald"
    race=bitter-swamp-lizard
    image=units/skalds/skald.png
    hitpoints=38
    movement_type=lizard
    movement=5
    experience=55
    level=1
    alignment=chaotic
    advances_to=Skald Hunter,Skald Maniac
    cost=20
    usage=mixed fighter
    description= _ "The Saurian Skalds are a slower-moving breed of saurians that are almost monstrous, but considerably tougher. They are defined by their hidden natural spines, which they can project en masse, as well as their poisonous bite which they use as a last resort."

    die_sound=hiss-die.wav
    {DEFENSE_ANIM "units/skalds.png" "units/skalds.png" hiss-big.wav }
    [attack]
        name=bite
        description=_"poisonous bite"
        type=pierce
        range=melee
        icon=attacks/fangs.png
        damage=6
        number=1
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=spines
        description=_"spines"
        type=pierce
        range=ranged
        damage=3
        number=7
        icon=attacks/thorns.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=bite
        [/filter_attack]
        [frame]
            begin=-150
            end=-100
            image="units/skalds.png"
        [/frame]
        [if]
            hits=no
            [frame]
                begin=-100
                end=0
                image="units/skalds.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/if]
        [else]
            hits=yes
            [frame]
                sound=bite.ogg
                begin=-100
                end=0
                image="units/skalds.png"
            [/frame]
        [/else]
        [frame]
            begin=0
            end=50
            image="units/skalds.png"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=spines
        [/filter_attack]
        [missile_frame]
            begin=-100
            end=0
            image="projectiles/thorns.png"
            image_diagonal="projectiles/thorns-ne.png"
        [/missile_frame]
        [frame]
            begin=-100
            end=0
            image="units/skalds.png"
            sound={SOUND_LIST:THROW}
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=0
                end=50
                image="units/skalds.png"
                sound=dart.wav
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=0
                end=50
                image="units/skalds.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
[/unit_type]
