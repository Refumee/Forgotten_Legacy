#textdomain wesnoth-Forgotten_Legacy
[unit_type]
    id=Skald Headhunter
    name= _ "Skald Headhunter"
    race=bitter-swamp-lizard
    image=units/skalds/skald-headhunter.png
    hitpoints=54
    movement_type=lizard
    movement=6
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=48
    usage=archer
    description= _ "Some Skalds possess natural defenses so deadly that even the slightest touch can prove fatal. Those who hone this gift to its fullest become known as Headhunters. Capable of launching a storm of spines with incredible speed and precision, they can bring down even the swiftest prey before it has a chance to escape. Headhunters serve as the Tribe's deadliest hunters, relentlessly pursuing their quarry and leaving little more than a trail of blood and scattered spines behind.

Special Notes: Headhunters can unleash a devastating barrage of spines. Keep your distance and use their ranged attack to soften up or finish off enemies before they can reach you."

    {DEFENSE_ANIM "units/skalds/skald-headhunter.png" "units/skalds/skald-headhunter.png" hiss-big.wav }
    die_sound=hiss-die.wav
    [attack]
        name=bite
        description=_"poisonous bite"
        type=pierce
        range=melee
        icon=attacks/fangs.png
        damage=8
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=spines
        description=_"spines"
        type=pierce
        range=ranged
        damage=4
        number=11
        icon=attacks/thorns.png
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    [/attack]
    [attack_anim]
        [filter_attack]
            name=bite
        [/filter_attack]
        [frame]
            begin=-150
            end=-100
            image="units/skalds/skald-headhunter.png"
        [/frame]
        [if]
            hits=no
            [frame]
                begin=-100
                end=0
                image="units/skalds/skald-headhunter.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/if]
        [else]
            hits=yes
            [frame]
                sound=bite.ogg
                begin=-100
                end=0
                image="units/skalds/skald-headhunter.png"
            [/frame]
        [/else]
        [frame]
            begin=0
            end=50
            image="units/skalds/skald-headhunter.png"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=spines
        [/filter_attack]
        [missile_frame]
            begin=-100
            end=0
            image="projectiles/thorns.png"
            image_diagonal="projectiles/thorns-ne.png"
        [/missile_frame]
        [frame]
            begin=-100
            end=0
            image="units/skalds/skald-headhunter.png"
            sound={SOUND_LIST:THROW}
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=0
                end=50
                image="units/skalds/skald-headhunter.png"
                sound=dart.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=0
                end=50
                image="units/skalds/skald-headhunter.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
[/unit_type]
