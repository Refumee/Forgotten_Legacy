#textdomain wesnoth-Forgotten_Legacy
[unit_type]
    id=Skald Hunter
    name= _ "Skald Hunter"
    race=bitter-swamp-lizard
    image=units/skalds/skald-hunter.png
    hitpoints=46
    movement_type=lizard
    movement=6
    experience=80
    level=2
    alignment=chaotic
    advances_to=Skald Headhunter
    cost=30
    usage=archer
    description= _ "Some Skalds' natural defenses are extremely deadly. Those that train themselves appropriately can release almost double the number of spines a normal Skald can throw. They usually take the role of the tribe's hunters since no prey can hope to avoid all the projectiles coming its way."

    {DEFENSE_ANIM "units/skalds/skald-hunter.png" "units/skalds/skald-hunter.png" hiss-big.wav }
    die_sound=hiss-die.wav
    [attack]
        name=bite
        description=_"poisonous bite"
        type=pierce
        range=melee
        icon=attacks/fangs.png
        damage=6
        number=2
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
    [/attack]
    [attack]
        name=spines
        description=_"spines"
        type=pierce
        range=ranged
        damage=3
        number=11
        icon=attacks/thorns.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=bite
        [/filter_attack]
        [frame]
            begin=-150
            end=-100
            image="units/skalds/skald-hunter.png"
        [/frame]
        [if]
            hits=no
            [frame]
                begin=-100
                end=0
                image="units/skalds/skald-hunter.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/if]
        [else]
            hits=yes
            [frame]
                sound=bite.ogg
                begin=-100
                end=0
                image="units/skalds/skald-hunter.png"
            [/frame]
        [/else]
        [frame]
            begin=0
            end=50
            image="units/skalds/skald-hunter.png"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=spines
        [/filter_attack]
        [missile_frame]
            begin=-100
            end=0
            image="projectiles/thorns.png"
            image_diagonal="projectiles/thorns-ne.png"
        [/missile_frame]
        [frame]
            begin=-100
            end=0
            image="units/skalds/skald-hunter.png"
            sound={SOUND_LIST:THROW}
        [/frame]
        [if]
            hits=yes
            [frame]
                begin=0
                end=50
                image="units/skalds/skald-hunter.png"
                sound=dart.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [frame]
                begin=0
                end=50
                image="units/skalds/skald-hunter.png"
                sound={SOUND_LIST:MISS}
            [/frame]
        [/else]
    [/attack_anim]
[/unit_type]
